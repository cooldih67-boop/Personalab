<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PersonaLab</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0d12;
    color: #f5f5f5;
    overflow-x: hidden;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    display: flex;
    min-height: 100vh;
}

.sidebar {
    width: 230px;
    background: #11141b;
    border-right: 1px solid #242936;
    padding: 20px;
    flex-shrink: 0;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 30px;
}

.logo span {
    color: #8b7cff;
}

.nav-btn {
    width: 100%;
    background: transparent;
    border: none;
    color: #aeb4c3;
    padding: 13px;
    text-align: left;
    border-radius: 10px;
    margin-bottom: 8px;
}

.nav-btn:hover,
.nav-btn.active {
    background: #1c2030;
    color: white;
}

.main {
    flex: 1;
    min-width: 0;
    padding: 20px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: 25px;
}

.btn {
    border: none;
    border-radius: 10px;
    padding: 10px 15px;
    background: #272d3d;
    color: white;
}

.btn:hover {
    background: #333b50;
}

.btn.primary {
    background: #7667ff;
}

.btn.primary:hover {
    background: #887bff;
}

.btn.danger {
    background: #5a2630;
}

.lab {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 20px;
}

.chat-card,
.panel,
.character-card,
.room-card {
    background: #11141b;
    border: 1px solid #242936;
    border-radius: 15px;
}

.chat-card {
    display: flex;
    flex-direction: column;
    min-height: 650px;
    overflow: hidden;
}

.chat-top {
    padding: 15px;
    border-bottom: 1px solid #242936;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

.chat-title {
    font-weight: bold;
}

.chat-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
}

.message {
    margin-bottom: 15px;
}

.message-name {
    font-weight: bold;
    margin-bottom: 4px;
}

.message-text {
    color: #d4d8e2;
    line-height: 1.5;
}

.message.director .message-name {
    color: #8b7cff;
}

.message.system .message-name {
    color: #62d5a5;
}

.typing {
    color: #7f8799;
    font-style: italic;
    margin-bottom: 15px;
}

.director-box {
    padding: 12px;
    border-top: 1px solid #242936;
    display: flex;
    gap: 8px;
}

.director-box input {
    flex: 1;
    min-width: 0;
    background: #181c25;
    border: 1px solid #2b3140;
    color: white;
    border-radius: 10px;
    padding: 12px;
    outline: none;
}

.director-box input:focus {
    border-color: #7667ff;
}

.panel {
    padding: 16px;
    height: fit-content;
}

.panel h3 {
    margin-top: 0;
}

.topic-box {
    background: #181c25;
    border-radius: 10px;
    padding: 12px;
    color: #c5cad5;
    line-height: 1.4;
    margin-bottom: 15px;
}

.relationship {
    padding: 10px 0;
    border-bottom: 1px solid #242936;
}

.relationship:last-child {
    border-bottom: none;
}

.rel-names {
    font-weight: bold;
    margin-bottom: 5px;
}

.rel-stats {
    color: #9299aa;
    font-size: 13px;
}

.events {
    margin-top: 15px;
}

.event {
    background: #181c25;
    border-radius: 9px;
    padding: 10px;
    margin-bottom: 8px;
    color: #cbd0dc;
    font-size: 13px;
}

.character-grid,
.room-grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fill,
        minmax(240px, 1fr)
    );
    gap: 15px;
}

.character-card,
.room-card {
    padding: 16px;
}

.character-name,
.room-name {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 8px;
}

.character-info,
.room-info {
    color: #9fa6b6;
    line-height: 1.5;
    font-size: 14px;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0;
}

.tag {
    background: #252b3a;
    color: #cdd2df;
    padding: 5px 8px;
    border-radius: 20px;
    font-size: 12px;
}

.card-actions {
    display: flex;
    gap: 7px;
    margin-top: 13px;
}

.empty {
    color: #8e95a6;
    padding: 20px 0;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 15px;
    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(600px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: #11141b;
    border: 1px solid #292f3c;
    border-radius: 16px;
    padding: 20px;
}

.modal-box h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    color: #c5cad5;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    background: #181c25;
    border: 1px solid #2b3140;
    color: white;
    border-radius: 9px;
    padding: 11px;
    outline: none;
}

.form-group textarea {
    min-height: 90px;
    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #7667ff;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
}

@media (max-width: 850px) {

    .app {
        display: block;
    }

    .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #242936;
        padding: 12px;
    }

    .logo {
        margin-bottom: 10px;
    }

    .nav {
        display: flex;
        gap: 7px;
        overflow-x: auto;
    }

    .nav-btn {
        width: auto;
        white-space: nowrap;
        margin: 0;
    }

    .main {
        padding: 12px;
    }

    .lab {
        grid-template-columns: 1fr;
    }

    .chat-card {
        min-height: 600px;
    }
}

@media (max-width: 500px) {

    .header {
        align-items: flex-start;
        flex-direction: column;
    }

    .chat-top {
        align-items: flex-start;
        flex-direction: column;
    }

    .director-box {
        flex-direction: column;
    }

    .director-box button {
        width: 100%;
    }
}

</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="logo">
        Persona<span>Lab</span>
    </div>

    <div class="nav">

        <button
            class="nav-btn active"
            onclick="showPage('lab', this)"
        >
            🧪 Lab
        </button>

        <button
            class="nav-btn"
            onclick="showPage('characters', this)"
        >
            👤 Characters
        </button>

        <button
            class="nav-btn"
            onclick="showPage('rooms', this)"
        >
            🏠 Rooms
        </button>

    </div>

</aside>


<main class="main">


<section id="lab" class="page active">

    <div class="header">

        <h1>Simulation Lab</h1>

        <div>

            <button
                id="generateButton"
                class="btn primary"
                onclick="generateTurns()"
            >
                Generate 20
            </button>

            <button
                class="btn"
                onclick="togglePause()"
            >
                <span id="pauseText">
                    Pause
                </span>
            </button>

        </div>

    </div>


    <div class="lab">


    <div class="chat-card">

        <div class="chat-top">

            <div class="chat-title">
                Current Simulation
            </div>

            <div class="chat-actions">

                <button
                    class="btn"
                    onclick="openCharacterModal()"
                >
                    + Character
                </button>

                <button
                    class="btn"
                    onclick="clearChat()"
                >
                    Clear
                </button>

            </div>

        </div>


        <div id="chat" class="chat"></div>


        <div class="director-box">

            <input
                id="directorInput"
                type="text"
                placeholder="Give the simulation a Director instruction..."
                onkeydown="if(event.key==='Enter') sendDirectorInstruction()"
            >

            <button
                class="btn primary"
                onclick="sendDirectorInstruction()"
            >
                Send
            </button>

        </div>

    </div>


    <aside class="panel">

        <h3>Simulation</h3>

        <div class="topic-box">

            <strong>Topic</strong>

            <div id="topicText">
                Free conversation
            </div>

        </div>


        <h3>Relationships</h3>

        <div id="relationships">

            <div class="empty">
                No relationships yet.
            </div>

        </div>


        <div class="events">

            <h3>Events</h3>

            <div id="events">

                <div class="empty">
                    Nothing notable yet.
                </div>

            </div>

        </div>

    </aside>


    </div>

</section>


<section id="characters" class="page">

    <div class="header">

        <h1>Characters</h1>

        <button
            class="btn primary"
            onclick="openCharacterModal()"
        >
            + Create Character
        </button>

    </div>

    <div
        id="characterGrid"
        class="character-grid"
    ></div>

</section>


<section id="rooms" class="page">

    <div class="header">

        <h1>Rooms</h1>

        <button
            class="btn primary"
            onclick="openRoomModal()"
        >
            + Create Room
        </button>

    </div>

    <div
        id="roomGrid"
        class="room-grid"
    ></div>

</section>


</main>

</div>


<div
    id="characterModal"
    class="modal"
>

<div class="modal-box">

    <h2>Create Character</h2>

    <div class="form-group">

        <label>Name</label>

        <input
            id="characterName"
            placeholder="Example: Alex"
        >

    </div>


    <div class="form-group">

        <label>Personality</label>

        <textarea
            id="characterPersonality"
            placeholder="Describe how they usually behave..."
        ></textarea>

    </div>


    <div class="form-group">

        <label>Traits</label>

        <input
            id="characterTraits"
            placeholder="funny, confident, stubborn"
        >

    </div>


    <div class="form-group">

        <label>Speaking Style</label>

        <textarea
            id="characterSpeaking"
            placeholder="Short sentences, sarcastic, formal, etc."
        ></textarea>

    </div>


    <div class="form-group">

        <label>Starting Memories</label>

        <textarea
            id="characterMemories"
            placeholder="Things this character remembers..."
        ></textarea>

    </div>


    <div class="modal-actions">

        <button
            class="btn"
            onclick="closeCharacterModal()"
        >
            Cancel
        </button>

        <button
            class="btn primary"
            onclick="createCharacter()"
        >
            Create
        </button>

    </div>

</div>

</div>


<div
    id="roomModal"
    class="modal"
>

<div class="modal-box">

    <h2>Create Room</h2>

    <div class="form-group">

        <label>Room Name</label>

        <input
            id="roomName"
            placeholder="Example: Cafeteria"
        >

    </div>


    <div class="form-group">

        <label>Description</label>

        <textarea
            id="roomDescription"
            placeholder="Describe the room..."
        ></textarea>

    </div>


    <div class="modal-actions">

        <button
            class="btn"
            onclick="closeRoomModal()"
        >
            Cancel
        </button>

        <button
            class="btn primary"
            onclick="createRoom()"
        >
            Create
        </button>

    </div>

</div>

</div>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const SUPABASE_URL =
    "https://riqoxjuzdjqisczezmse.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_gbrG0FYf42bNenKMX45jLg_JJe02Gle";

const FUNCTION_NAME =
    "personala-ai";


/* =========================================================
   DATA
   ========================================================= */

const STORAGE_KEY =
    "PersonaLab_Data_V3";

let data =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    ) || {

        characters: [

            {
                id: crypto.randomUUID(),
                name: "Alex",
                personality:
                    "Friendly, curious, energetic and likes meeting new people.",
                traits:
                    ["friendly", "curious", "energetic"],
                speaking:
                    "Casual and upbeat.",
                memories:
                    "Remembers that they enjoy talking with people."
            },

            {
                id: crypto.randomUUID(),
                name: "Nova",
                personality:
                    "Smart, confident and competitive. Likes proving their point.",
                traits:
                    ["smart", "confident", "competitive"],
                speaking:
                    "Direct and confident.",
                memories:
                    "Remembers that they hate losing arguments."
            },

            {
                id: crypto.randomUUID(),
                name: "Raven",
                personality:
                    "Quiet, observant and sarcastic. Does not trust people immediately.",
                traits:
                    ["quiet", "observant", "sarcastic"],
                speaking:
                    "Dry and sarcastic.",
                memories:
                    "Remembers that they usually observe before speaking."
            }

        ],

        rooms: [

            {
                id: crypto.randomUUID(),
                name: "Main Room",
                description:
                    "A simple room where everyone can talk."
            }

        ],

        messages: [],

        relationships: {},

        events: [],

        topic:
            "Free conversation"

    };


let paused = false;

let generating = false;


/* =========================================================
   SAVE
   ========================================================= */

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* =========================================================
   PAGE NAVIGATION
   ========================================================= */

function showPage(
    pageId,
    button
) {

    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.remove(
                "active"
            );

        });


    document
        .getElementById(pageId)
        .classList.add("active");


    document
        .querySelectorAll(".nav-btn")
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });


    button.classList.add("active");


    if (pageId === "characters") {
        renderCharacters();
    }

    if (pageId === "rooms") {
        renderRooms();
    }

}


/* =========================================================
   CHAT RENDER
   ========================================================= */

function renderChat() {

    const chat =
        document.getElementById(
            "chat"
        );


    chat.innerHTML = "";


    if (!data.messages.length) {

        chat.innerHTML = `
            <div class="empty">
                The simulation hasn't started yet.
                Press <strong>Generate 20</strong>
                to let the characters talk.
            </div>
        `;

        return;
    }


    data.messages.forEach(
        message => {

            addMessageToScreen(
                message
            );

        }
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================================
   ADD ONE MESSAGE
   ========================================================= */

function addMessageToScreen(
    message
) {

    const chat =
        document.getElementById(
            "chat"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message";


    if (
        message.character ===
        "Director"
    ) {

        div.classList.add(
            "director"
        );

    }


    if (
        message.character ===
        "System"
    ) {

        div.classList.add(
            "system"
        );

    }


    div.innerHTML = `

        <div class="message-name">
            ${escapeHTML(
                message.character
            )}
        </div>

        <div class="message-text">
            ${escapeHTML(
                message.message
            )}
        </div>

    `;


    chat.appendChild(div);


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================================
   TYPING INDICATOR
   ========================================================= */

function showTyping(
    character
) {

    removeTyping();


    const chat =
        document.getElementById(
            "chat"
        );


    const div =
        document.createElement(
            "div"
        );


    div.id =
        "typingIndicator";


    div.className =
        "typing";


    div.textContent =
        `${character} is typing...`;


    chat.appendChild(div);


    chat.scrollTop =
        chat.scrollHeight;

}


function removeTyping() {

    const typing =
        document.getElementById(
            "typingIndicator"
        );


    if (typing) {
        typing.remove();
    }

}


/* =========================================================
   DELAY
   ========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================================
   CHARACTER RENDER
   ========================================================= */

function renderCharacters() {

    const grid =
        document.getElementById(
            "characterGrid"
        );


    if (!data.characters.length) {

        grid.innerHTML = `
            <div class="empty">
                No characters yet.
            </div>
        `;

        return;
    }


    grid.innerHTML = "";


    data.characters.forEach(
        character => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "character-card";


            const tags =
                character.traits
                    .map(
                        trait => `
                            <span class="tag">
                                ${escapeHTML(
                                    trait
                                )}
                            </span>
                        `
                    )
                    .join("");


            card.innerHTML = `

                <div class="character-name">
                    ${escapeHTML(
                        character.name
                    )}
                </div>

                <div class="character-info">
                    ${escapeHTML(
                        character.personality
                    )}
                </div>

                <div class="tags">
                    ${tags}
                </div>

                <div class="character-info">
                    <strong>Speaking:</strong>
                    ${escapeHTML(
                        character.speaking
                    )}
                </div>

                <div class="character-info">
                    <strong>Memories:</strong>
                    ${escapeHTML(
                        character.memories
                    )}
                </div>

                <div class="card-actions">

                    <button
                        class="btn danger"
                        onclick="deleteCharacter('${character.id}')"
                    >
                        Delete
                    </button>

                </div>

            `;


            grid.appendChild(card);

        }
    );

}


/* =========================================================
   ROOMS
   ========================================================= */

function renderRooms() {

    const grid =
        document.getElementById(
            "roomGrid"
        );


    if (!data.rooms.length) {

        grid.innerHTML = `
            <div class="empty">
                No rooms yet.
            </div>
        `;

        return;
    }


    grid.innerHTML = "";


    data.rooms.forEach(
        room => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "room-card";


            card.innerHTML = `

                <div class="room-name">
                    🏠 ${escapeHTML(
                        room.name
                    )}
                </div>

                <div class="room-info">
                    ${escapeHTML(
                        room.description
                    )}
                </div>

                <div class="card-actions">

                    <button
                        class="btn danger"
                        onclick="deleteRoom('${room.id}')"
                    >
                        Delete
                    </button>

                </div>

            `;


            grid.appendChild(card);

        }
    );

}


/* =========================================================
   CHARACTER MODAL
   ========================================================= */

function openCharacterModal() {

    document
        .getElementById(
            "characterModal"
        )
        .classList.add("show");

}


function closeCharacterModal() {

    document
        .getElementById(
            "characterModal"
        )
        .classList.remove("show");

}


function createCharacter() {

    const name =
        document
            .getElementById(
                "characterName"
            )
            .value
            .trim();


    const personality =
        document
            .getElementById(
                "characterPersonality"
            )
            .value
            .trim();


    const traits =
        document
            .getElementById(
                "characterTraits"
            )
            .value
            .split(",")
            .map(
                x => x.trim()
            )
            .filter(Boolean);


    const speaking =
        document
            .getElementById(
                "characterSpeaking"
            )
            .value
            .trim();


    const memories =
        document
            .getElementById(
                "characterMemories"
            )
            .value
            .trim();


    if (!name) {

        alert(
            "Give the character a name."
        );

        return;
    }


    data.characters.push({

        id:
            crypto.randomUUID(),

        name,

        personality:
            personality ||
            "A unique personality.",

        traits,

        speaking:
            speaking ||
            "Natural and conversational.",

        memories:
            memories ||
            "No starting memories."

    });


    saveData();

    renderCharacters();

    closeCharacterModal();


    document.getElementById(
        "characterName"
    ).value = "";

    document.getElementById(
        "characterPersonality"
    ).value = "";

    document.getElementById(
        "characterTraits"
    ).value = "";

    document.getElementById(
        "characterSpeaking"
    ).value = "";

    document.getElementById(
        "characterMemories"
    ).value = "";

}


/* =========================================================
   DELETE CHARACTER
   ========================================================= */

function deleteCharacter(id) {

    const character =
        data.characters.find(
            c => c.id === id
        );


    if (!character) return;


    if (
        !confirm(
            `Delete ${character.name}?`
        )
    ) {
        return;
    }


    data.characters =
        data.characters.filter(
            c => c.id !== id
        );


    saveData();

    renderCharacters();

}


/* =========================================================
   ROOM MODAL
   ========================================================= */

function openRoomModal() {

    document
        .getElementById(
            "roomModal"
        )
        .classList.add("show");

}


function closeRoomModal() {

    document
        .getElementById(
            "roomModal"
        )
        .classList.remove("show");

}


function createRoom() {

    const name =
        document
            .getElementById(
                "roomName"
            )
            .value
            .trim();


    const description =
        document
            .getElementById(
                "roomDescription"
            )
            .value
            .trim();


    if (!name) {

        alert(
            "Give the room a name."
        );

        return;
    }


    data.rooms.push({

        id:
            crypto.randomUUID(),

        name,

        description:
            description ||
            "An ordinary room."

    });


    saveData();

    renderRooms();

    closeRoomModal();


    document.getElementById(
        "roomName"
    ).value = "";

    document.getElementById(
        "roomDescription"
    ).value = "";

}


/* =========================================================
   DELETE ROOM
   ========================================================= */

function deleteRoom(id) {

    const room =
        data.rooms.find(
            r => r.id === id
        );


    if (!room) return;


    if (
        !confirm(
            `Delete ${room.name}?`
        )
    ) {
        return;
    }


    data.rooms =
        data.rooms.filter(
            r => r.id !== id
        );


    saveData();

    renderRooms();

}


/* =========================================================
   PAUSE
   ========================================================= */

function togglePause() {

    paused =
        !paused;


    document.getElementById(
        "pauseText"
    ).textContent =
        paused
            ? "Resume"
            : "Pause";


    if (paused) {

        removeTyping();

        addSystemMessage(
            "Simulation paused."
        );

    } else {

        addSystemMessage(
            "Simulation resumed."
        );

    }

}


/* =========================================================
   DIRECTOR
   ========================================================= */

function sendDirectorInstruction() {

    const input =
        document.getElementById(
            "directorInput"
        );


    const instruction =
        input.value.trim();


    if (!instruction) return;


    data.messages.push({

        character:
            "Director",

        message:
            instruction

    });


    input.value = "";


    data.topic =
        instruction;


    saveData();

    addMessageToScreen({
        character: "Director",
        message: instruction
    });


    document.getElementById(
        "topicText"
    ).textContent =
        instruction;

}


/* =========================================================
   SYSTEM MESSAGE
   ========================================================= */

function addSystemMessage(
    message
) {

    data.messages.push({

        character:
            "System",

        message

    });


    saveData();

    addMessageToScreen({

        character:
            "System",

        message

    });

}


/* =========================================================
   GENERATE 20
   ========================================================= */

async function generateTurns() {

    if (generating) {
        return;
    }


    if (paused) {

        alert(
            "The simulation is paused. Press Resume first."
        );

        return;
    }


    if (!data.characters.length) {

        alert(
            "Create at least one character first."
        );

        return;
    }


    generating =
        true;


    const generateButton =
        document.getElementById(
            "generateButton"
        );


    generateButton.disabled =
        true;


    generateButton.textContent =
        "Thinking...";


    try {

        const result =
            await callAI();


        if (
            !result ||
            !Array.isArray(
                result.turns
            )
        ) {

            throw new Error(
                "The AI returned an invalid response."
            );

        }


        /*
          IMPORTANT:

          We process the relationship/event data
          immediately, but reveal the dialogue
          one message at a time.
        */

        if (
            Array.isArray(
                result.relationships
            )
        ) {

            processRelationships(
                result.relationships
            );

        }


        if (
            Array.isArray(
                result.events
            )
        ) {

            processEvents(
                result.events
            );

        }


        removeTyping();


        /*
          Reveal each AI message individually.
        */

        for (
            const turn of result.turns
        ) {

            if (paused) {
                break;
            }


            if (
                !turn ||
                !turn.character ||
                !turn.message
            ) {
                continue;
            }


            const validCharacter =
                data.characters.some(
                    character =>
                        character.name ===
                        turn.character
                );


            if (!validCharacter) {
                continue;
            }


            showTyping(
                turn.character
            );


            /*
              Short natural delay.

              Longer messages get slightly
              more time before appearing.
            */

            const delay =
                Math.min(
                    1800,
                    Math.max(
                        650,
                        turn.message.length * 18
                    )
                );


            await wait(delay);


            if (paused) {

                removeTyping();

                break;

            }


            removeTyping();


            const message = {

                character:
                    turn.character,

                message:
                    turn.message

            };


            data.messages.push(
                message
            );


            saveData();

            addMessageToScreen(
                message
            );


            /*
              Tiny gap before the next person.
            */

            await wait(250);

        }


        renderRelationships();

        renderEvents();


    } catch (error) {

        console.error(error);


        removeTyping();


        addSystemMessage(
            "AI error: " +
            error.message
        );

    }


    generating =
        false;


    generateButton.disabled =
        false;


    generateButton.textContent =
        "Generate 20";

}


/* =========================================================
   CALL SUPABASE
   ========================================================= */

async function callAI() {

    const endpoint =
        `${SUPABASE_URL}/functions/v1/${FUNCTION_NAME}`;


    const conversation =
        data.messages
            .slice(-80)
            .map(
                message => ({

                    character:
                        message.character,

                    message:
                        message.message

                })
            );


    const relationships =
        Object.values(
            data.relationships
        );


    const response =
        await fetch(
            endpoint,
            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        `Bearer ${SUPABASE_ANON_KEY}`

                },

                body:
                    JSON.stringify({

                        characters:
                            data.characters,

                        conversation,

                        topic:
                            data.topic,

                        turns:
                            20,

                        relationships,

                        directorInstruction:
                            data.topic

                    })

            }
        );


    if (!response.ok) {

        const text =
            await response.text();


        throw new Error(
            `Supabase function error ${response.status}: ${text}`
        );

    }


    return await response.json();

}


/* =========================================================
   RELATIONSHIPS
   ========================================================= */

function relationshipKey(
    from,
    to
) {

    return `${from}|||${to}`;

}


function getRelationship(
    from,
    to
) {

    const key =
        relationshipKey(
            from,
            to
        );


    if (
        !data.relationships[key]
    ) {

        data.relationships[key] = {

            from,

            to,

            friendship:
                0,

            trust:
                0,

            tension:
                0

        };

    }


    return data.relationships[key];

}


function processRelationships(
    list
) {

    list.forEach(
        rel => {

            if (
                !rel.from ||
                !rel.to
            ) {
                return;
            }


            const relationship =
                getRelationship(
                    rel.from,
                    rel.to
                );


            relationship.friendship +=
                Number(
                    rel.friendship
                ) || 0;


            relationship.trust +=
                Number(
                    rel.trust
                ) || 0;


            relationship.tension +=
                Number(
                    rel.tension
                ) || 0;


            relationship.friendship =
                clamp(
                    relationship.friendship,
                    -100,
                    100
                );


            relationship.trust =
                clamp(
                    relationship.trust,
                    -100,
                    100
                );


            relationship.tension =
                clamp(
                    relationship.tension,
                    0,
                    100
                );

        }
    );


    saveData();

}


function relationshipLabel(
    rel
) {

    if (
        rel.tension >= 70
    ) {

        return "Rivals";

    }


    if (
        rel.trust <= -50
    ) {

        return "Distrustful";

    }


    if (
        rel.friendship >= 70 &&
        rel.trust >= 50
    ) {

        return "Close Friends";

    }


    if (
        rel.friendship >= 35
    ) {

        return "Friends";

    }


    if (
        rel.tension >= 30
    ) {

        return "Tension";

    }


    return "Neutral";

}


function renderRelationships() {

    const container =
        document.getElementById(
            "relationships"
        );


    const list =
        Object.values(
            data.relationships
        );


    if (!list.length) {

        container.innerHTML = `
            <div class="empty">
                No relationships yet.
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    list.forEach(
        rel => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "relationship";


            div.innerHTML = `

                <div class="rel-names">
                    ${escapeHTML(
                        rel.from
                    )}
                    →
                    ${escapeHTML(
                        rel.to
                    )}
                </div>

                <div class="rel-stats">

                    ${relationshipLabel(
                        rel
                    )}

                    · Friendship:
                    ${rel.friendship}

                    · Trust:
                    ${rel.trust}

                    · Tension:
                    ${rel.tension}

                </div>

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   EVENTS
   ========================================================= */

function processEvents(
    events
) {

    events.forEach(
        event => {

            if (!event) {
                return;
            }


            const description =
                typeof event ===
                "string"

                    ? event

                    : event.description;


            if (!description) {
                return;
            }


            data.events.unshift({

                description,

                time:
                    new Date()
                        .toLocaleTimeString()

            });

        }
    );


    data.events =
        data.events.slice(
            0,
            20
        );


    saveData();

}


function renderEvents() {

    const container =
        document.getElementById(
            "events"
        );


    if (!data.events.length) {

        container.innerHTML = `
            <div class="empty">
                Nothing notable yet.
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    data.events.forEach(
        event => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "event";


            div.innerHTML =
                escapeHTML(
                    event.description
                );


            container.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   HELPERS
   ========================================================= */

function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function escapeHTML(
    value
) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

renderChat();

renderCharacters();

renderRooms();

renderRelationships();

renderEvents();

document.getElementById(
    "topicText"
).textContent =
    data.topic;

</script>
